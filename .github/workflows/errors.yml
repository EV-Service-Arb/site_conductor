env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTC_WRAPPER: ""
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: short
jobs:
  checks:
    name: checks
    needs: load_nix
    outputs:
      seconds: ${{ steps.particle.outputs.seconds }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lean cache setup
        run: |
          mkdir -p /tmp/nix-lean-cache
          chmod 0777 /tmp/nix-lean-cache
          printf '#!/bin/sh\nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\nnix copy --to "file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true" $OUT_PATHS || true\n' > /tmp/nix-lean-pbh.sh
          chmod 0755 /tmp/nix-lean-pbh.sh
        shell: bash
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = true
            post-build-hook = /tmp/nix-lean-pbh.sh
            extra-substituters = file:///tmp/nix-lean-cache
            extra-trusted-substituters = file:///tmp/nix-lean-cache
            require-sigs = false
      - if: github.ref_name != github.event.repository.default_branch
        name: Restore lean nix cache
        uses: actions/cache/restore@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - if: github.ref_name == github.event.repository.default_branch
        name: Lean nix cache (built-only paths)
        uses: actions/cache@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - run: echo "T_PARTICLE=$(date +%s)" >> "$GITHUB_ENV"
      - run: nix run .#test -- --severity errors --serial checks
      - id: particle
        if: always()
        run: 'echo "seconds=$((T_PARTICLE ? $(date +%s) - T_PARTICLE : 0))" >> "$GITHUB_OUTPUT"'
    timeout-minutes: 45
  e2e:
    name: e2e
    needs: load_nix
    outputs:
      seconds: ${{ steps.particle.outputs.seconds }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lean cache setup
        run: |
          mkdir -p /tmp/nix-lean-cache
          chmod 0777 /tmp/nix-lean-cache
          printf '#!/bin/sh\nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\nnix copy --to "file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true" $OUT_PATHS || true\n' > /tmp/nix-lean-pbh.sh
          chmod 0755 /tmp/nix-lean-pbh.sh
        shell: bash
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = true
            post-build-hook = /tmp/nix-lean-pbh.sh
            extra-substituters = file:///tmp/nix-lean-cache
            extra-trusted-substituters = file:///tmp/nix-lean-cache
            require-sigs = false
      - if: github.ref_name != github.event.repository.default_branch
        name: Restore lean nix cache
        uses: actions/cache/restore@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - if: github.ref_name == github.event.repository.default_branch
        name: Lean nix cache (built-only paths)
        uses: actions/cache@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - if: github.ref_name != github.event.repository.default_branch
        uses: actions/cache/restore@v5
        with:
          key: particle-e2e-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm
          restore-keys: particle-e2e-${{ runner.os }}-
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/cache@v5
        with:
          key: particle-e2e-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm
          restore-keys: particle-e2e-${{ runner.os }}-
      - run: echo "T_PARTICLE=$(date +%s)" >> "$GITHUB_ENV"
      - run: nix run .#test -- --severity errors --serial e2e
      - id: particle
        if: always()
        run: 'echo "seconds=$((T_PARTICLE ? $(date +%s) - T_PARTICLE : 0))" >> "$GITHUB_OUTPUT"'
    timeout-minutes: 45
  frontend-test:
    name: frontend-test
    needs: load_nix
    outputs:
      seconds: ${{ steps.particle.outputs.seconds }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lean cache setup
        run: |
          mkdir -p /tmp/nix-lean-cache
          chmod 0777 /tmp/nix-lean-cache
          printf '#!/bin/sh\nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\nnix copy --to "file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true" $OUT_PATHS || true\n' > /tmp/nix-lean-pbh.sh
          chmod 0755 /tmp/nix-lean-pbh.sh
        shell: bash
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = true
            post-build-hook = /tmp/nix-lean-pbh.sh
            extra-substituters = file:///tmp/nix-lean-cache
            extra-trusted-substituters = file:///tmp/nix-lean-cache
            require-sigs = false
      - if: github.ref_name != github.event.repository.default_branch
        name: Restore lean nix cache
        uses: actions/cache/restore@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - if: github.ref_name == github.event.repository.default_branch
        name: Lean nix cache (built-only paths)
        uses: actions/cache@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - if: github.ref_name != github.event.repository.default_branch
        uses: actions/cache/restore@v5
        with:
          key: particle-frontend-test-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm
          restore-keys: particle-frontend-test-${{ runner.os }}-
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/cache@v5
        with:
          key: particle-frontend-test-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm
          restore-keys: particle-frontend-test-${{ runner.os }}-
      - run: echo "T_PARTICLE=$(date +%s)" >> "$GITHUB_ENV"
      - run: nix run .#test -- --severity errors --serial frontend-test
      - id: particle
        if: always()
        run: 'echo "seconds=$((T_PARTICLE ? $(date +%s) - T_PARTICLE : 0))" >> "$GITHUB_OUTPUT"'
    timeout-minutes: 45
  frontend-typecheck:
    name: frontend-typecheck
    needs: load_nix
    outputs:
      seconds: ${{ steps.particle.outputs.seconds }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lean cache setup
        run: |
          mkdir -p /tmp/nix-lean-cache
          chmod 0777 /tmp/nix-lean-cache
          printf '#!/bin/sh\nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\nnix copy --to "file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true" $OUT_PATHS || true\n' > /tmp/nix-lean-pbh.sh
          chmod 0755 /tmp/nix-lean-pbh.sh
        shell: bash
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = true
            post-build-hook = /tmp/nix-lean-pbh.sh
            extra-substituters = file:///tmp/nix-lean-cache
            extra-trusted-substituters = file:///tmp/nix-lean-cache
            require-sigs = false
      - if: github.ref_name != github.event.repository.default_branch
        name: Restore lean nix cache
        uses: actions/cache/restore@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - if: github.ref_name == github.event.repository.default_branch
        name: Lean nix cache (built-only paths)
        uses: actions/cache@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - if: github.ref_name != github.event.repository.default_branch
        uses: actions/cache/restore@v5
        with:
          key: particle-frontend-typecheck-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm
          restore-keys: particle-frontend-typecheck-${{ runner.os }}-
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/cache@v5
        with:
          key: particle-frontend-typecheck-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm
          restore-keys: particle-frontend-typecheck-${{ runner.os }}-
      - run: echo "T_PARTICLE=$(date +%s)" >> "$GITHUB_ENV"
      - run: nix run .#test -- --severity errors --serial frontend-typecheck
      - id: particle
        if: always()
        run: 'echo "seconds=$((T_PARTICLE ? $(date +%s) - T_PARTICLE : 0))" >> "$GITHUB_OUTPUT"'
    timeout-minutes: 45
  load_nix:
    runs-on: ubuntu-latest
    steps:
      - name: Lean cache setup
        run: |
          mkdir -p /tmp/nix-lean-cache
          chmod 0777 /tmp/nix-lean-cache
          printf '#!/bin/sh\nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\nnix copy --to "file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true" $OUT_PATHS || true\n' > /tmp/nix-lean-pbh.sh
          chmod 0755 /tmp/nix-lean-pbh.sh
        shell: bash
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = true
            post-build-hook = /tmp/nix-lean-pbh.sh
            extra-substituters = file:///tmp/nix-lean-cache
            extra-trusted-substituters = file:///tmp/nix-lean-cache
            require-sigs = false
      - if: github.ref_name != github.event.repository.default_branch
        name: Restore lean nix cache
        uses: actions/cache/restore@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - if: github.ref_name == github.event.repository.default_branch
        name: Lean nix cache (built-only paths)
        uses: actions/cache@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - name: Cache packages
        run: |
          # Pre-fetch packages into nix store so they're cached for dependent jobs
          # Use nix-shell which properly sets up env vars like PKG_CONFIG_PATH
          nix-shell -p ffmpeg deno pkg-config openssl.out openssl.dev git --run "echo packages cached"
  pre_ci:
    uses: valeratrades/.github/.github/workflows/pre_ci.yml@main
  report:
    if: always() && github.ref_name == github.event.repository.default_branch
    name: Report
    needs:
      - checks
      - e2e
      - frontend-test
      - frontend-typecheck
      - rust-tests
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          PARTICLES: '[{"generic":false,"name":"rust-tests"},{"generic":false,"name":"frontend-typecheck"},{"generic":false,"name":"frontend-test"},{"generic":false,"name":"e2e"},{"generic":false,"name":"checks"}]'
          TIMED: '[{"key":"build","output":"prepare_seconds","particle":"rust-tests"},{"key":"test","output":"run_seconds","particle":"rust-tests"}]'
        name: Tally the particles
        run: |
          read -r failed total seconds incomplete < <(jq -rn --argjson needs "$NEEDS" --argjson spec "$PARTICLES" '
            def secs: if . == null or . == "" then 0 else tonumber end;
            [ $spec[] | . as $p
              | if $p.generic
                then $needs.particles as $j | { ok: ($j.outputs[$p.name + "_status"] == "ok"), t: ($j.outputs[$p.name + "_seconds"] | secs), r: $j.result }
                else $needs[$p.name] as $j | { ok: ($j.result == "success"), t: ($j.outputs.seconds | secs), r: $j.result } end ]
            | "\(map(select(.ok | not)) | length) \(length) \(map(.t) | add) \(map(select(.r == "skipped" or .r == "cancelled")) | length)"')
          if [ "$incomplete" != 0 ]; then
            echo "::notice::a particle's job was skipped or cancelled: the badge keeps its last complete run"
            exit 0
          fi
          # only a succeeded job's numbers: a failed run's are partial
          jq -rn --argjson needs "$NEEDS" --argjson timed "$TIMED" '
            $timed[] | select($needs[.particle].result == "success")
            | ($needs[.particle].outputs[.output] | tonumber) as $s
            | "BADGE_\(.key | ascii_upcase)=\($s / 60 | floor)m \($s % 60)s"' >> "$GITHUB_ENV"
          time="$((seconds / 60))m $((seconds % 60))s"
          if [ "$failed" = 0 ]; then msg="✓ $time" color=brightgreen; else msg="✗ $failed/$total · $time" color=red; fi
          { echo "BADGE_MESSAGE=$msg"; echo "BADGE_COLOR=$color"; } >> "$GITHUB_ENV"
      - env:
          loc_gist_token: ${{ secrets.loc_gist_token }}
        if: env.BADGE_MESSAGE != ''
        name: Ensure loc_gist_token secret is configured
        run: |
          if [ -z "${loc_gist_token}" ]; then
            echo "::error::Secret 'loc_gist_token' is not set (empty in this job)."
            if [ "${{ github.event.repository.private }}" = "true" ]; then
              echo "::error::This repo is PRIVATE. On GitHub Free-plan orgs, organization secrets are NOT exposed to private repos — if 'loc_gist_token' is set org-wide it still won't reach here. Fix: set it repo-level (gh secret set loc_gist_token -R ${{ github.repository }}), or upgrade the org to Team/Enterprise."
            else
              echo "::error::Add it under Settings → Secrets and variables → Actions (repo-level, or org-level with 'All repositories' visibility — org secrets reach public repos on any plan)."
            fi
            echo "::error::Create a token, then: gh secret set loc_gist_token --repo <owner>/<repo> --body YOUR_TOKEN"
            echo "::error::Bulk-provision all repos: https://github.com/valeratrades/nix/tree/e4338bf5943d7403b949a8e079f9073987d9cd68/home/scripts/shared_github_secrets.bash"
            exit 1
          fi
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.loc_gist_token }}
        if: env.BADGE_MESSAGE != ''
        name: Update badge gist
        run: |
          PNAME="${GITHUB_REPOSITORY##*/}"
          gh api -X PATCH gists/b48e6f02c61942200e7d1e3eeabf9bcb --silent \
          -f "files[$PNAME-errors.json][content]={\"schemaVersion\": 1, \"label\": \"errors\", \"message\": \"$BADGE_MESSAGE\", \"color\": \"$BADGE_COLOR\", \"labelColor\": \"420d09\"}"
      - env:
          loc_gist_token: ${{ secrets.loc_gist_token }}
        if: env.BADGE_BUILD != '' && env.BADGE_TEST != ''
        name: Ensure loc_gist_token secret is configured
        run: |
          if [ -z "${loc_gist_token}" ]; then
            echo "::error::Secret 'loc_gist_token' is not set (empty in this job)."
            if [ "${{ github.event.repository.private }}" = "true" ]; then
              echo "::error::This repo is PRIVATE. On GitHub Free-plan orgs, organization secrets are NOT exposed to private repos — if 'loc_gist_token' is set org-wide it still won't reach here. Fix: set it repo-level (gh secret set loc_gist_token -R ${{ github.repository }}), or upgrade the org to Team/Enterprise."
            else
              echo "::error::Add it under Settings → Secrets and variables → Actions (repo-level, or org-level with 'All repositories' visibility — org secrets reach public repos on any plan)."
            fi
            echo "::error::Create a token, then: gh secret set loc_gist_token --repo <owner>/<repo> --body YOUR_TOKEN"
            echo "::error::Bulk-provision all repos: https://github.com/valeratrades/nix/tree/e4338bf5943d7403b949a8e079f9073987d9cd68/home/scripts/shared_github_secrets.bash"
            exit 1
          fi
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.loc_gist_token }}
        if: env.BADGE_BUILD != '' && env.BADGE_TEST != ''
        name: Update badge gist
        run: |
          PNAME="${GITHUB_REPOSITORY##*/}"
          gh api -X PATCH gists/b48e6f02c61942200e7d1e3eeabf9bcb --silent \
          -f "files[$PNAME-build.json][content]={\"schemaVersion\": 1, \"label\": \"build\", \"message\": \"$BADGE_BUILD\", \"color\": \"lightblue\"}" \
          -f "files[$PNAME-test.json][content]={\"schemaVersion\": 1, \"label\": \"test\", \"message\": \"$BADGE_TEST\", \"color\": \"lightblue\"}"
  rust-tests:
    if: needs.pre_ci.outputs.continue
    name: Rust ${{matrix.rust}}
    needs:
      - load_nix
      - pre_ci
    outputs:
      prepare_seconds: ${{ steps.prepare.outputs.seconds }}
      run_seconds: ${{ steps.tests.outputs.seconds }}
      seconds: ${{ steps.particle.outputs.seconds }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lean cache setup
        run: |
          mkdir -p /tmp/nix-lean-cache
          chmod 0777 /tmp/nix-lean-cache
          printf '#!/bin/sh\nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\nnix copy --to "file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true" $OUT_PATHS || true\n' > /tmp/nix-lean-pbh.sh
          chmod 0755 /tmp/nix-lean-pbh.sh
        shell: bash
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = true
            post-build-hook = /tmp/nix-lean-pbh.sh
            extra-substituters = file:///tmp/nix-lean-cache
            extra-trusted-substituters = file:///tmp/nix-lean-cache
            require-sigs = false
      - if: github.ref_name != github.event.repository.default_branch
        name: Restore lean nix cache
        uses: actions/cache/restore@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - if: github.ref_name == github.event.repository.default_branch
        name: Lean nix cache (built-only paths)
        uses: actions/cache@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{matrix.rust}}
      - name: Install mold
        uses: rui314/setup-mold@v1
      - if: github.ref == 'refs/heads/release'
        name: Set RUSTFLAGS for release branch
        run: echo "RUSTFLAGS=-Dwarnings" >> $GITHUB_ENV
      - if: matrix.rust == 'nightly'
        name: Enable type layout randomization
        run: |-
          nix-shell -p ffmpeg deno pkg-config openssl.out openssl.dev git --command "export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A ffmpeg --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A deno --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.out --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.dev --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && printf '#!/bin/sh\\nexec \"\$@\" -Zrandomize-layout --cfg=exhaustive\\n' > /tmp/randomize-layout.sh
          chmod +x /tmp/randomize-layout.sh
          echo RUSTC_WORKSPACE_WRAPPER=/tmp/randomize-layout.sh >> \$GITHUB_ENV
          "
      - name: Download modified by pre-ci Cargo.toml files
        uses: actions/download-artifact@v7
        with:
          name: modified-cargo-files
      - run: nix-shell -p ffmpeg deno pkg-config openssl.out openssl.dev git --command "export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A ffmpeg --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A deno --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.out --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.dev --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && cargo update"
      - uses: Swatinem/rust-cache@v2
      - run: echo "T_PARTICLE=$(date +%s)" >> "$GITHUB_ENV"
      - env:
          TIMED: ${{ matrix.rust == 'nightly' }}
        id: prepare
        run: |-
          nix-shell -p ffmpeg deno pkg-config openssl.out openssl.dev git --command "export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A ffmpeg --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A deno --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.out --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.dev --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && start=\$(date +%s)
          cargo test --workspace --no-run
          if [ \"\$TIMED\" = true ]; then echo \"seconds=\$((\$(date +%s) - start))\" >> \"\$GITHUB_OUTPUT\"; fi
          "
      - run: nix-shell -p ffmpeg deno pkg-config openssl.out openssl.dev git --command "export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A ffmpeg --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A deno --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.out --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.dev --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && cargo check --workspace --all-targets"
      - env:
          TIMED: ${{ matrix.rust == 'nightly' }}
        id: tests
        run: |-
          nix-shell -p ffmpeg deno pkg-config openssl.out openssl.dev git --command "export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A ffmpeg --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A deno --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.out --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.dev --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\" && start=\$(date +%s)
          cargo test --workspace
          if [ \"\$TIMED\" = true ]; then echo \"seconds=\$((\$(date +%s) - start))\" >> \"\$GITHUB_OUTPUT\"; fi
          "
      - id: particle
        if: always() && (matrix.rust == 'nightly')
        run: 'echo "seconds=$((T_PARTICLE ? $(date +%s) - T_PARTICLE : 0))" >> "$GITHUB_OUTPUT"'
    strategy:
      fail-fast: false
      matrix:
        rust:
          - nightly
          - nightly-2026-09-24
    timeout-minutes: 45
