[package]
name = "sa_places"
description = "A Google place from what a person pastes: its id, a Maps URL, or a Places API (New) search; every Places answer paid for once through the conductor's queries cache, the keys rotated"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.cargo-machete]
ignored = ["schemars"] # `ConfigJsonSchema`'s expansion names it; no source does

[features]
# `Account` read from a v_utils config file, its keys `{ env = "…" }`.
settings = ["dep:v_utils", "v_utils/cli", "dep:schemars"]

[dependencies]
base64.workspace = true
eyre.workspace = true
jiff.workspace = true
reqwest.workspace = true
rustls.workspace = true
sa_auth.workspace = true
sa_core.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
v_utils = { workspace = true, optional = true }
zeroize.workspace = true

[dev-dependencies]
axum.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] } # as the conductor is built
tempfile.workspace = true

[lints]
workspace = true
