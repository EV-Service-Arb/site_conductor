[package]
name = "sa_gbp"
description = "A GBP as the conductor defines it: its life, its country, and the snapshot the services are told of"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
# `ts_rs::TS` on the enums, for the conductor's front end.
ts = ["dep:ts-rs"]
# `utoipa::ToSchema` on the wire types, for review_archive's OpenAPI document.
utoipa = ["dep:utoipa"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true, features = ["uuid"] }
uuid = { workspace = true, features = ["serde"] }

[lints]
workspace = true
