[package]
name = "sa_guard"
description = "the guard: holds every enabled API of each billed project in nix/google.nix by a lever set before it spends, or leaves it to the account's unguarded, from Cloud Run"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[[bin]]
name = "guard"
path = "src/main.rs"

[dependencies]
eyre.workspace = true
jiff = { workspace = true, features = ["serde", "tzdb-bundle-always"] }
regex.workspace = true
reqwest = { workspace = true, features = ["blocking", "query"] }
rustls.workspace = true
sa_core.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
