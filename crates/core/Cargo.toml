[package]
name = "sa_core"
description = "The conductor without I/O: a GBP's states, country and snapshot, source signatures, brand ids, the Telegram rules and messages"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
# what an operation spends, in a service's route table (`prices::Spends`)
api = ["dep:axum", "dep:ev_lib"]

[dependencies]
axum = { workspace = true, optional = true }
ev_lib = { workspace = true, features = ["api"], optional = true }
hex.workspace = true
hmac.workspace = true
jiff = { workspace = true, features = ["serde", "tzdb-bundle-always"] }
sa_alerts.workspace = true
sa_auth.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strum.workspace = true
subtle.workspace = true
thiserror.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["serde"] }

[lints]
workspace = true
