[package]
name = "sa_auth"
description = "Service-Arb's permission catalog, and the assertion the panel signs for the services behind it"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
# The verifier and the gate of a service's routes.
axum = ["dep:axum", "dep:ev_lib", "dep:strum", "dep:tracing"]
catalog = ["concierge_iam/catalog"]
ts = ["concierge_iam/ts"]

[dependencies]
axum = { workspace = true, optional = true }
base64.workspace = true
concierge_iam.workspace = true
ed25519-dalek.workspace = true
ev_lib = { workspace = true, features = ["api"], optional = true }
hex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strum = { workspace = true, optional = true }
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
concierge_iam = { workspace = true, features = ["catalog"] }
getrandom.workspace = true
tokio.workspace = true
tower = { workspace = true, features = ["util"] }

[[test]]
name = "gate"
required-features = ["axum"]

[lints]
workspace = true
