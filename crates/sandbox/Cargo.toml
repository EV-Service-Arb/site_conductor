[package]
name = "sa_sandbox"
description = "The sandbox worker: model-written Starlark, run in a sealed child of the conductor, and the wire between them"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.cargo-machete]
ignored = [
    "allocative",
] # only its version: starlark's own requirement admits ones it does not build with

[dependencies]
allocative.workspace = true
anyhow.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["process"] }
schemars.workspace = true
seccompiler.workspace = true
serde.workspace = true
serde_json.workspace = true
starlark.workspace = true

[dev-dependencies]
libc.workspace = true
serde_json.workspace = true

[[test]]
name = "sealed"
harness = false # its binary is the worker too: started with WORKER, or a probe, it is the child

[lints]
workspace = true
