[package]
name = "sa_server"
description = "The Service-Arb conductor: the `panel` binary, its CLI, the sign-in, the forward and the hubs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
path = "src/lib.rs"

# The binary keeps the name the image, the flake and the docs know it by.
[[bin]]
name = "panel"
path = "src/main.rs"

[features]
# What the HTTP tests share: a stand-in service, the conductor signed in, a browser.
testing = ["sa_panel/testing", "tower/util"]

[dependencies]
axum = { workspace = true, features = ["ws"] }
clap.workspace = true
color-eyre.workspace = true
ev_lib = { workspace = true, features = ["settings", "error_monitoring", "api"] }
eyre.workspace = true
futures.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
hyper-util.workspace = true
jiff = { workspace = true, features = ["serde"] }
percent-encoding.workspace = true
reqwest = { workspace = true, features = ["multipart", "stream"] }
rustix.workspace = true
sa_alerts.workspace = true
sa_auth = { workspace = true, features = ["axum", "catalog"] }
sa_browsers.workspace = true
sa_contracts.workspace = true
sa_core = { workspace = true, features = ["api"] }
sa_panel.workspace = true
sa_places = { workspace = true, features = ["settings"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tonic.workspace = true
tower = { workspace = true, features = ["limit", "load-shed"] }
tower-http = { workspace = true, features = ["fs", "timeout"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["serde"] }
v_utils = { workspace = true, features = ["cli"] }
zeroize.workspace = true

[build-dependencies]
ev_lib = { workspace = true, features = ["api_docs"] }

[dev-dependencies]
axum = { workspace = true, features = ["multipart"] }
base64.workspace = true
hex.workspace = true
hmac.workspace = true
image.workspace = true
sa_panel = { workspace = true, features = ["testing"] }
sa_server = { workspace = true, features = ["testing"] }
sqlx.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
