[package]
name = "sa_panel"
description = "The conductor's engine: sessions through concierge, source keys, access requests, people's GMBs and tokens, the alerts and live hubs' state"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
# Throwaway databases and signed batches, for this crate's and the server's tests.
testing = []

[dependencies]
base64.workspace = true
chacha20poly1305.workspace = true
eyre.workspace = true
futures.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
icu_locale.workspace = true
image.workspace = true
jiff = { workspace = true, features = ["serde"] }
percent-encoding.workspace = true
reqwest = { workspace = true, features = ["multipart", "socks"] }
rustls-platform-verifier.workspace = true
sa_alerts.workspace = true
sa_auth.workspace = true
sa_browsers.workspace = true
sa_core = { workspace = true, features = ["ts"] }
sa_places.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
strum.workspace = true
subtle.workspace = true
tg_types.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
ts-rs.workspace = true
tzf-rs.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["serde", "v7"] }
zeroize.workspace = true

[dev-dependencies]
sa_panel = { workspace = true, features = ["testing"] }
uuid = { workspace = true, features = ["v7"] }
zeroize.workspace = true

[lints]
workspace = true
