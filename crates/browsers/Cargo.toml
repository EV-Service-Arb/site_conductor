[package]
name = "sa_browsers"
description = "A managing gmail's antidetect browser: the devices it poses as, what the conductor launches it with, and the runner (`sa_browsers serve`) that runs it headless"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
test = false

[[bin]]
name = "sa_browsers"
path = "src/main.rs"
test = false

[features]

[dependencies]
axum = { workspace = true, features = ["ws"] }
