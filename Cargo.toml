[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Valeriy Sakharov <valeratrades@gmail.com>"]
license = "BlueOak-1.0.0"
repository = "https://github.com/EV-Service-Arb/site_conductor"
readme = "README.md"

[workspace.dependencies]
sa_alerts = { path = "crates/alerts", version = "0.1.0" }
sa_auth = { path = "crates/auth", version = "0.1.0" }
sa_browsers = { path = "crates/browsers", version = "0.1.0" }
sa_contracts = { path = "crates/contracts", version = "0.1.0" }
sa_core = { path = "crates/core", version = "0.1.0" }
sa_panel = { path = "crates/panel", version = "0.1.0" }
sa_places = { path = "crates/places", version = "0.1.0" }
sa_sandbox = { path = "crates/sandbox", version = "0.1.0" }
sa_server = { path = "crates/server", version = "0.1.0" }
sa_trace = { path = "crates/trace", version = "0.1.0" }

allocative = "=0.3.4" # starlark 0.13's maps derive it over hashbrown 0.14, which 0.3.6 left
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.9", features = ["derive", "env"] }
color-eyre = "0.6.5"
concierge_iam = "0.1.2"
dioxus = { version = "0.7.10", default-features = false }
ed25519-dalek = "3.0.0"
ev_lib = { version = "0.34.1", default-features = false }
eyre = "0.6.14"
futures = "0.3.34"
getrandom = "0.4.3"
# placement's library, its vocabulary and its overlay, from one revision (docs/ARCHITECTURE.md, Placement)
gmaps_optimal_placement = { git = "https://github.com/EV-Service-Arb/gmaps_optimal_placement", branch = "main" }
gmaps_optimal_placement_core = { git = "https://github.com/EV-Service-Arb/gmaps_optimal_placement", branch = "main" }
gmaps_optimal_placement_overlay = { git = "https://github.com/EV-Service-Arb/gmaps_optimal_placement", branch = "main" }
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.5"
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
icu_locale = "2.4.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jiff = "0.2.46"
libc = "0.2.191"
mail-parser = "1.0.1"
percent-encoding = "2.3.2"
prost = "0.14.6"
protox = "0.10.0"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
ring = "0.17.14"
rustix = { version = "1.1.6", features = ["process"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] } # ring, not aws-lc: aws-lc-sys rebuilds a bundled C library per target dir
rustls-platform-verifier = "0.7.1"
schemars = { version = "1.2.3", features = ["uuid1", "jiff02"] }
seccompiler = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate", "uuid", "json"] }
starlark = "=0.13.0" # 0.14 turns on serde_json's arbitrary_precision for the whole binary; the worker's heap cap is its hidden before_stmt hook
strum = { version = "0.28.0", features = ["derive"] }
subtle = "2.6.1"
tempfile = "3.27.0"
tg_types = "0.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-tungstenite = "0.30.0"
tonic = { version = "0.14.9", features = ["tls-ring"] }
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tzf-rs = { version = "2.3.0", default-features = false, features = ["bundled"] }
url = "2.5.8"
uuid = "1.29.3"
v_utils = { version = "2.24.1", default-features = false, features = ["macros"] }
zeroize = "1.9.2"

[workspace.lints.clippy]
float_cmp = "allow"
len_zero = "allow"
if_not_else = "warn"
integer_division = "warn"

[workspace.lints.rust]
stable_features = "allow"
unused_features = "allow"

[workspace.lints.cargo]
non_kebab_case_bins = "allow"

# allocative 0.3.4 implements Allocative for both Infallible and `!`, which nightly-2026-09-24 makes one type; 0.3.6+ does not build under starlark_map 0.13. Only that impl is removed.
[patch.crates-io]
allocative = { path = "vendor/allocative" }

# the sandbox's Starlark evaluates two orders of magnitude slower unoptimized, past what its tests can wait
[profile.dev.package.starlark]
opt-level = 3
[profile.dev.package.starlark_syntax]
opt-level = 3
[profile.dev.package.starlark_map]
opt-level = 3

