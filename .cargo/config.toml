[[include]]
optional = true
path = "local.toml"
[unstable]
checksum-freshness = true # a source's content, not its mtime: `dev --fixed`'s copies build into this checkout's build dir

[profile.rust]
codegen-backend = "cranelift"

[profile.dev]
split-debuginfo = "unpacked"

[target.'cfg(all(target_arch = "x86_64", target_os = "linux", target_env = "gnu"))']
rustflags = "-C link-arg=-fuse-ld=mold --cfg tokio_unstable -Z threads=8 -Z track-diagnostics"
